<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinross Parking Registration</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

        <!-- Minified version -->
        <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
</head>

<body lang="en-US">
        <main>
                <h1>Kinross Parking</h1>
                <form action="/parking.html" method="GET">
                        <p>
                                <label>Client Code</label>
                                <input type="text" name="client-code" id="client-code" />
                        </p>
                        <p>
                                <label>Licence Plate (optional)</label>
                                <input type="text" name="plate" id="plate" />
                        </p>
                        <p>
                                <button type="submit">Register for Parking</button>
                                <button type="button" onclick="QRCreate()">Create QR Code</button>
                        </p>
                </form>
                <div id="qr-code"></div>
        </main>
        <script>
        function QRCreate() {
                var code = new QRCode(document.getElementById('qr-code'), "https://parking.mattread.ca/parking.html?client-code=" + document.getElementById('client-code').value + "&plate=" + document.getElementById('plate').value); 
        }
        </script>
</body>
</html>
